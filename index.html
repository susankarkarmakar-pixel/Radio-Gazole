<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio- Gazole Block</title>
    <style>
        /* রেট্রো রেডিও ডিজাইন (saloon.wtf স্টাইল) */
        :root {
            --bg-color: #f4e4bc;
            --radio-bg: #2c241b;
            --text-color: #fff8e7;
            --accent-color: #d4a373;
            --live-color: #ff4d4d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e6d5ac 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .radio-container {
            background-color: var(--radio-bg);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 800px;
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.5),
                inset 0 2px 5px rgba(255,255,255,0.1);
            border: 4px solid #4a3f35;
            text-align: center;
            position: relative;
        }

        .radio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #4a3f35;
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .radio-title {
            color: var(--text-color);
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a1510;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #4a3f35;
        }

        .live-dot {
            width: 12px;
            height: 12px;
            background-color: var(--live-color);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .live-text {
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* ভিডিও রেসপন্সিভ র‍্যাপার */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 3px solid #4a3f35;
            background: #000;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .quote-box {
            margin-top: 25px;
            background: #1a1510;
            color: var(--accent-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #4a3f35;
            font-size: 1.1rem;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            transition: opacity 0.5s ease-in-out;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }

        /* মোবাইল রেসপন্সিভ */
        @media (max-width: 600px) {
            .radio-title { font-size: 1.2rem; }
            .radio-container { padding: 15px; width: 95%; }
            .radio-header { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="radio-container">
        <div class="radio-header">
            <div class="radio-title">📻 Radio- Gazole Block</div>
            <div class="live-indicator">
                <div class="live-dot"></div>
                <span class="live-text"><span id="listener-count">24</span> শ্রোতা অনলাইন</span>
            </div>
        </div>

        <div class="video-wrapper">
            <!-- আপনার YouTube ভিডিও এমবেড কোড -->
            <iframe 
                src="https://www.youtube.com/embed/v3gwlHi1J6A" 
                title="ভাতার Status ও Payment Status মোবাইলে কীভাবে দেখবেন? | SAMARTH Portal | West Bengal" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="quote-box">
            <span id="dynamic-quote">"গাজোল ব্লকের আপডেট এবং তথ্যের একমাত্র ঠিকানা..."</span>
        </div>
    </div>

    <script>
        // লাইভ শ্রোতার সংখ্যা র‍্যান্ডমলি পরিবর্তন হবে (১৫ থেকে ৬০ এর মধ্যে)
        function updateListeners() {
            const count = Math.floor(Math.random() * (60 - 15 + 1)) + 15;
            document.getElementById('listener-count').innerText = count;
        }
        setInterval(updateListeners, 5000); // প্রতি ৫ সেকেন্ডে আপডেট
        updateListeners();

        // উক্তি পরিবর্তন করার স্ক্রিপ্ট
        const quotes = [
            "গাজোল ব্লকের আপডেট এবং তথ্যের একমাত্র ঠিকানা...",
            "সঠিক তথ্য, সঠিক সময়ে, আপনার মোবাইলে।",
            "SAMARTH Portal এবং সরকারি সুবিধার খবর সবার আগে।",
            "রেডিও গাজোল ব্লকে আপনাকে স্বাগতম! রেডিওর আড্ডায় মেতে উঠুন।"
        ];
        let quoteIndex = 0;
        
        setInterval(() => {
            const quoteElement = document.getElementById('dynamic-quote');
            quoteElement.style.opacity = 0;
            setTimeout(() => {
                quoteIndex = (quoteIndex + 1) % quotes.length;
                quoteElement.innerText = `"${quotes[quoteIndex]}"`;
                quoteElement.style.opacity = 1;
            }, 500);
        }, 6000); // প্রতি ৬ সেকেন্ডে উক্তি পরিবর্তন
    </script>
</body>
</html>
